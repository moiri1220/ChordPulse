[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chordpulse-backend"
version = "0.1.0"
description = "Core audio analysis and MusicXML generation engine for ChordPulse"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10.2,<1.0",
    "music21>=9.3,<10.0",
    "numpy>=1.24,<3.0",
    "soundfile>=0.12,<1.0",
    "torch>=2.0.0",
    "beat-this>=1.1.0",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.10.0"]
api = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
chordpulse-analyze = "chordpulse.cli:main"
chordpulse-api = "chordpulse.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
